function explain(q){
 const t=(q.topic||"").toLowerCase(), s=q.subject||"";
 if(s==="गणित" && t.includes("निर्देशांक")){
   if(q.question.includes("दूरी")) return "x-अक्ष से दूरी |y| होती है और y-अक्ष से दूरी |x| होती है। इसलिए निर्देशांकों के चिह्नों को देखकर दूरी निकालें; दूरी हमेशा धनात्मक मानी जाती है।";
   if(q.question.includes("परावर्तित")) return "x-अक्ष के सापेक्ष reflection में x वही रहता है और y का चिह्न बदलता है: (x,y) → (x,−y)।";
   if(q.question.includes("चतुर्थांश")) return "चतुर्थांश के संकेत याद रखें: I में (+,+), II में (−,+), III में (−,−), IV में (+,−)। दिए गए बिंदु के x और y के संकेत मिलाकर सही चतुर्थांश चुनें।";
   if(q.question.includes("अक्ष")) return "यदि x=0 हो तो बिंदु y-अक्ष पर और यदि y=0 हो तो बिंदु x-अक्ष पर होता है। दोनों शून्य हों तो मूलबिंदु होता है।";
   return "निर्देशांक के x और y के मान तथा उनके चिह्न देखें। इन्हीं से बिंदु की स्थिति, चतुर्थांश या अक्ष निर्धारित होता है।";
 }
 if(s==="गणित" && t.includes("रैखिक")) return "दिए गए समीकरण में ज्ञात x या y का मान सीधे रखें और दूसरे चर को अलग करें। यदि intercept दिया हो तो x-अक्ष पर y=0 और y-अक्ष पर x=0 रखकर जाँच करें।";

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function render(test){
 const base=test==="02"?test02:test03;
 const sub=document.getElementById("subject").value, search=document.getElementById("search").value.trim().toLowerCase();
 const qs=base.filter(q=>(sub==="all"||q.subject===sub)&&(!search||((q.question||"")+" "+(q.topic||"")).toLowerCase().includes(search)));
 document.getElementById("stats").textContent=qs.length+" प्रश्न प्रदर्शित";
 const by={}; qs.forEach(q=>(by[q.subject]??=[]).push(q));
 let out="";
 Object.entries(by).forEach(([subject,arr])=>{
  out+=`<h2 class="subject">${esc(subject)} <small style="font-size:13px;color:#64748b">(${arr.length} प्रश्न)</small></h2>`;
  arr.forEach(q=>{
   const isSub=q.type==="subjective";
   let body=`<article class="q"><div class="qhead"><span class="qid">Q${q.id}</span><span class="badge">${esc(q.topic||"General")}</span><span class="badge difficulty">${esc(q.difficulty||"")}</span></div><div class="question">${esc(q.question||"")}</div>`;
   if(q.passage) body+=`<div class="passage"><b>Passage:</b> ${esc(q.passage)}</div>`;
   if(q.image) body+=`<img src="${esc(q.image)}" alt="Question image" loading="lazy">`;
   if(!isSub){
    body+=`<div class="options">${(q.options||[]).map((o,i)=>`<div class="opt ${i===q.correct?'correct':''}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)} ${i===q.correct?'✓':''}</div>`).join("")}</div>`;
    const ans=q.options?.[q.correct]??"";
    body+=`<div class="answer"><b>सही उत्तर:</b> ${String.fromCharCode(65+(q.correct??0))}. ${esc(ans)}</div><div class="explain"><b>Detailed Explanation:</b> ${explain(q)}<br><br><b>Answer logic:</b> प्रश्न में दिए गए विकल्पों में वही विकल्प चुना गया है जो ऊपर बताए गए नियम/तथ्य को सीधे संतुष्ट करता है।</div>`;
   }else{
    const key=test+"-"+q.id, model=subjectiveAnswers[key]||"मॉडल उत्तर तैयार करते समय प्रश्न के सभी आवश्यक बिंदु, परिभाषा/तथ्य और जहाँ आवश्यक हो वहाँ चरण लिखें।";
    body+=`<div class="model"><div class="model-title">✍️ Model Answer / Expected Answer</div>${model}</div>`;
   }
   body+="</article>"; out+=body;
  });
 });
 document.getElementById("content").innerHTML=out||'<div class="empty">इस filter में कोई प्रश्न नहीं मिला।</div>';
}
function fillSubjects(){
 const all=[...test02,...test03].map(q=>q.subject).filter(Boolean);
 [...new Set(all)].forEach(s=>document.getElementById("subject").insertAdjacentHTML("beforeend",`<option>${esc(s)}</option>`));
}
let current="02";
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");current=b.dataset.test;document.getElementById("subject").value="all";document.getElementById("search").value="";render(current)}));
document.getElementById("subject").addEventListener("change",()=>render(current));
document.getElementById("search").addEventListener("input",()=>render(current));
fillSubjects(); render(current);
</script>
