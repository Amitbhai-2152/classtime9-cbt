name: Verify Test Separation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-paper-separation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify TEST 02 / TEST 03
        run: node scripts/verify-test-separation.mjs
